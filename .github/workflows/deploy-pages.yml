name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and build
        env:
          VITE_BASE_PATH: /energy-healing/
          VITE_SITE_URL: https://kathysenergyhealing.com
        run: npm run check

      - name: Verify prerendered SEO artifact
        run: |
          set -euo pipefail

          verify_page() {
            local file="$1"
            local canonical="$2"
            local title_token="$3"

            test -s "$file"
            grep -Fq "$title_token" "$file"
            grep -Fq "$canonical" "$file"
            grep -Fq 'application/ld+json' "$file"
            grep -Fq 'id="root"><div' "$file"

            if grep -Fq 'name="keywords"' "$file"; then
              echo "Obsolete meta keywords were found in $file."
              exit 1
            fi
          }

          verify_page dist/index.html "https://kathysenergyhealing.com/" "Kathy Curr Energy Healing"
          verify_page dist/about/index.html "https://kathysenergyhealing.com/about/" "Meet the Practitioner"
          verify_page dist/services/index.html "https://kathysenergyhealing.com/services/" "Reiki"
          verify_page dist/what-to-expect/index.html "https://kathysenergyhealing.com/what-to-expect/" "What to Expect"
          verify_page dist/podcast/index.html "https://kathysenergyhealing.com/podcast/" "Podcast Guest Appearances"
          verify_page dist/community/index.html "https://kathysenergyhealing.com/community/" "Community"
          verify_page dist/faq/index.html "https://kathysenergyhealing.com/faq/" "FAQ"
          verify_page dist/contact/index.html "https://kathysenergyhealing.com/contact/" "Contact"
          verify_page dist/policies/index.html "https://kathysenergyhealing.com/policies/" "Policies"

          test -s dist/404.html
          grep -Fq "Page Not Found" dist/404.html
          grep -Fq "noindex, nofollow" dist/404.html
          grep -Fq "https://kathysenergyhealing.com/sitemap.xml" dist/robots.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify live Pages deployment
        run: |
          set -euo pipefail
          base_url="https://workfolios.github.io/energy-healing"

          for attempt in {1..12}; do
            status=$(curl -sS -L -o home.html -w '%{http_code}' "$base_url/")
            if [ "$status" = "200" ]; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "The deployed homepage did not become available in time."
              exit 1
            fi
            sleep 10
          done

          grep -Fq "Kathy Curr Energy Healing" home.html
          grep -Fq "https://kathysenergyhealing.com/" home.html
          grep -Fq 'application/ld+json' home.html
          grep -Fq 'id="root"><div' home.html

          asset_path=$(grep -oE 'src="/energy-healing/assets/[^"]+\.js"' home.html | head -n 1 | cut -d'"' -f2)
          test -n "$asset_path"
          curl -fsSL "https://workfolios.github.io${asset_path}" -o app.js
          grep -q "mrenjbda" app.js

          declare -A expected_tokens=(
            [about]="Meet the Practitioner"
            [services]="Reiki"
            [what-to-expect]="What to Expect"
            [podcast]="Podcast Guest Appearances"
            [community]="Community"
            [faq]="FAQ"
            [contact]="Contact"
            [policies]="Policies"
          )

          for route in about services what-to-expect podcast community faq contact policies; do
            status=$(curl -sS -L -o "$route.html" -w '%{http_code}' "$base_url/$route/")
            test "$status" = "200"
            grep -Fq "${expected_tokens[$route]}" "$route.html"
            grep -Fq "https://kathysenergyhealing.com/$route/" "$route.html"
            grep -Fq 'application/ld+json' "$route.html"
            grep -Fq 'id="root"><div' "$route.html"
          done

          missing_status=$(curl -sS -L -o missing.html -w '%{http_code}' "$base_url/seo-smoke-test-missing")
          test "$missing_status" = "404"
          grep -Fq "Page Not Found" missing.html
          grep -Fq "noindex, nofollow" missing.html

  report:
    runs-on: ubuntu-latest
    needs: [build, deploy, smoke-test]
    if: always()
    steps:
      - name: Record deployment results
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_TEST_RESULT: ${{ needs.smoke-test.result }}
        run: |
          post_stage_status() {
            local result="$1"
            local context="$2"
            local success_description="$3"
            local failure_description="$4"

            if [ "$result" = "success" ]; then
              stage_state=success
              stage_description="$success_description"
            else
              stage_state=failure
              stage_description="$failure_description: $result"
            fi

            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="$stage_state" \
              -f context="$context" \
              -f description="$stage_description"
          }

          post_stage_status "$BUILD_RESULT" "github-pages/build" \
            "Prerender build and artifact verification passed" \
            "Prerender build or artifact verification failed"

          post_stage_status "$DEPLOY_RESULT" "github-pages/publish" \
            "GitHub Pages publication passed" \
            "GitHub Pages publication failed"

          post_stage_status "$SMOKE_TEST_RESULT" "github-pages/live-smoke-test" \
            "Live route and metadata verification passed" \
            "Live route or metadata verification failed"

          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ] && [ "$SMOKE_TEST_RESULT" = "success" ]; then
            state=success
            description="Pages deployment and live smoke test passed"
          else
            state=failure
            description="Pages deployment or live smoke test failed"
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="github-pages/deployment" \
            -f description="$description"
