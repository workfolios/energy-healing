name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and build
        env:
          VITE_BASE_PATH: /energy-healing/
          VITE_SITE_URL: https://kathysenergyhealing.com
        run: npm run check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify live Pages deployment
        run: |
          set -euo pipefail
          base_url="https://workfolios.github.io/energy-healing"

          for attempt in {1..12}; do
            if curl -fsSL "$base_url/" -o home.html; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "The deployed homepage did not become available in time."
              exit 1
            fi
            sleep 10
          done

          grep -q "Kathy Curr | Reiki Energy Healing" home.html

          asset_path=$(grep -oE 'src="/energy-healing/assets/[^"]+\.js"' home.html | head -n 1 | cut -d'"' -f2)
          test -n "$asset_path"
          curl -fsSL "https://workfolios.github.io${asset_path}" -o app.js
          grep -q "mrenjbda" app.js

          for route in about services what-to-expect podcast community faq contact policies; do
            curl -sSL "$base_url/$route" -o "$route.html"
            grep -q "Kathy Curr | Reiki Energy Healing" "$route.html"
          done

  report:
    runs-on: ubuntu-latest
    needs: [build, deploy, smoke-test]
    if: always()
    steps:
      - name: Record deployment result
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_TEST_RESULT: ${{ needs.smoke-test.result }}
        run: |
          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ] && [ "$SMOKE_TEST_RESULT" = "success" ]; then
            state=success
            description="Pages deployment and live smoke test passed"
          else
            state=failure
            description="Pages deployment or live smoke test failed"
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="github-pages/deployment" \
            -f description="$description"
